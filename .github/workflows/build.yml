name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. تثبيت Java (نسخة 21)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. تثبيت مكتبات المشروع
        run: npm install --legacy-peer-deps

      - name: 5. تهيئة Next.js للعمل على الهاتف
        run: |
          echo "/** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true }
          };
          export default nextConfig;" > next.config.mjs

      - name: 6. كتابة الدفتر السري (.env) لتخطي حارس قاعدة البيانات 📝🤫
        run: |
          echo "DATABASE_URL=postgresql://dummy_user:dummy_password@localhost:5432/dummy_db" > .env
          echo "تم إنشاء الدفتر السري بنجاح!"

      - name: 7. استبعاد ملفات الـ API الخاصة بالسيرفر مؤقتاً
        run: |
          echo "=== جاري تنظيف ملفات السيرفر لتوافق الهاتف ==="
          rm -rf src/app/api
          rm -rf app/api
          echo "تم الاستبعاد بنجاح!"

      - name: 8. بناء ملفات الويب الثابتة (out)
        run: npm run build

      - name: 9. تهيئة وتثبيت Capacitor تلقائياً للهاتف
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android --legacy-peer-deps
          
          rm -f capacitor.config.json capacitor.config.ts
          echo '{
            "appId": "com.grocery.debt",
            "appName": "Grocery Debt",
            "webDir": "out"
          }' > capacitor.config.json
          
          npx cap add android
          npx cap sync android

      - name: 10. حل مشكلة Kotlin المكررة
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: 11. صلاحيات البناء
        run: chmod +x android/gradlew

      - name: 12. بناء الـ APK النهائي
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 13. رفع ملف الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

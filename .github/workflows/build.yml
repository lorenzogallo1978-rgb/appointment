name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. تثبيت Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. تثبيت مكتبات المشروع
        run: npm install --legacy-peer-deps

      - name: 5. إعداد Next.js للتطبيق
        run: |
          cat > next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            trailingSlash: true,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true }
          };

          export default nextConfig;
          EOF

      - name: 6. ملف قاعدة بيانات وهمي
        run: |
          echo "DATABASE_URL=postgresql://dummy_user:dummy_password@localhost:5432/dummy_db" > .env

      - name: 7. حذف API لأنها لا تعمل داخل APK
        run: |
          rm -rf src/app/api
          rm -rf app/api

      - name: 8. تجهيز التطبيق للعمل أوفلاين داخل الجوال
        run: |
          cat > mobile-patch.cjs <<'EOF'
          const fs = require("fs");
          const path = require("path");

          function walk(dir, cb) {
            if (!fs.existsSync(dir)) return;
            for (const item of fs.readdirSync(dir)) {
              const full = path.join(dir, item);
              const stat = fs.statSync(full);
              if (stat.isDirectory()) walk(full, cb);
              else cb(full);
            }
          }

          function mockServerActions(root) {
            walk(root, (file) => {
              if (!file.match(/\.(ts|tsx|js|jsx)$/)) return;

              const original = fs.readFileSync(file, "utf8");

              if (!original.includes('"use server"') && !original.includes("'use server'")) {
                return;
              }

              console.log("تحويل Server Action إلى LocalStorage:", file);

              const typeNames = new Set();
              for (const m of original.matchAll(/export\s+(?:type|interface)\s+(\w+)/g)) {
                typeNames.add(m[1]);
              }

              const exportNames = new Set();

              for (const m of original.matchAll(/export\s+(?:async\s+)?function\s+(\w+)/g)) {
                exportNames.add(m[1]);
              }

              for (const m of original.matchAll(/export\s+const\s+(\w+)/g)) {
                exportNames.add(m[1]);
              }

              const known = [
                "getPersons",
                "getPerson",
                "createPerson",
                "updatePerson",
                "deletePerson",
                "createDebt",
                "addDebt",
                "updateDebt",
                "deleteDebt",
                "getDebts",
                "getPasswords",
                "createPassword",
                "deletePassword",
                "exportData",
                "importData"
              ];

              for (const name of known) exportNames.add(name);

              let code = `// @ts-nocheck
          // هذا الملف تم تحويله ليعمل أوفلاين داخل تطبيق Android

          `;

              for (const name of typeNames) {
                code += `export type ${name} = any;\n`;
                code += `export const ${name} = {};\n`;
              }

              code += `

          function parseInput(input) {
            if (!input) return {};
            if (typeof input.get === "function") {
              const obj = {};
              input.forEach((value, key) => {
                obj[key] = value;
              });
              return obj;
            }
            return input;
          }

          function getDB() {
            if (typeof window === "undefined") return { persons: [] };
            try {
              const raw = localStorage.getItem("grocery_offline_db");
              return raw ? JSON.parse(raw) : { persons: [] };
            } catch (e) {
              return { persons: [] };
            }
          }

          function saveDB(db) {
            if (typeof window === "undefined") return;
            localStorage.setItem("grocery_offline_db", JSON.stringify(db));
            setTimeout(() => {
              try {
                window.location.reload();
              } catch (e) {}
            }, 150);
          }

          function realId(id) {
            if (typeof window !== "undefined" && String(id) === "1") {
              return localStorage.getItem("current_person_id") || "1";
            }
            return String(id);
          }

          function smart(value) {
            if (Array.isArray(value)) {
              return new Proxy(value, {
                get(target, prop) {
                  if (prop === "success") return true;
                  if (prop === "data") return target;
                  return target[prop];
                }
              });
            }

            if (value && typeof value === "object") {
              return new Proxy(value, {
                get(target, prop) {
                  if (prop === "success") return true;
                  if (prop === "data") return target;
                  if (prop === "0") return target;
                  if (prop === "length") return 1;
                  return target[prop];
                }
              });
            }

            return { success: true, data: value };
          }

          export async function getPersons() {
            const db = getDB();
            return smart(db.persons || []);
          }

          export async function getPerson(id) {
            const db = getDB();
            const id2 = realId(id);
            const person = (db.persons || []).find(p => String(p.id) === String(id2));

            return smart(person || {
              id: id2,
              name: "",
              phone: "",
              debts: [],
              createdAt: new Date().toISOString()
            });
          }

          export async function createPerson(input) {
            const data = parseInput(input);
            const db = getDB();

            if (!db.persons) db.persons = [];

            const person = {
              id: Date.now().toString(),
              name: data.name || data.fullName || "شخص جديد",
              phone: data.phone || "",
              debts: [],
              createdAt: new Date().toISOString(),
              ...data
            };

            db.persons.push(person);
            saveDB(db);

            return { success: true, data: person };
          }

          export async function updatePerson(id, input) {
            const data = parseInput(input);
            const db = getDB();
            const id2 = realId(id);

            if (!db.persons) db.persons = [];

            const index = db.persons.findIndex(p => String(p.id) === String(id2));

            if (index !== -1) {
              db.persons[index] = {
                ...db.persons[index],
                ...data
              };
              saveDB(db);
              return { success: true, data: db.persons[index] };
            }

            return { success: false };
          }

          export async function deletePerson(id) {
            const db = getDB();
            const id2 = realId(id);

            if (!db.persons) db.persons = [];

            db.persons = db.persons.filter(p => String(p.id) !== String(id2));
            saveDB(db);

            return { success: true };
          }

          export async function createDebt(personId, input) {
            const data = parseInput(input);
            const db = getDB();
            const id2 = realId(personId);

            if (!db.persons) db.persons = [];

            const index = db.persons.findIndex(p => String(p.id) === String(id2));

            if (index !== -1) {
              if (!db.persons[index].debts) db.persons[index].debts = [];

              const debt = {
                id: Date.now().toString(),
                amount: Number(data.amount || data.value || 0),
                description: data.description || data.note || "",
                date: data.date || new Date().toISOString(),
                createdAt: new Date().toISOString(),
                ...data
              };

              db.persons[index].debts.push(debt);
              saveDB(db);

              return { success: true, data: debt };
            }

            return { success: false };
          }

          export async function addDebt(...args) {
            return createDebt(...args);
          }

          export async function updateDebt(personId, debtId, input) {
            const data = parseInput(input);
            const db = getDB();
            const id2 = realId(personId);

            const person = (db.persons || []).find(p => String(p.id) === String(id2));

            if (person && person.debts) {
              const index = person.debts.findIndex(d => String(d.id) === String(debtId));
              if (index !== -1) {
                person.debts[index] = {
                  ...person.debts[index],
                  ...data
                };
                saveDB(db);
                return { success: true, data: person.debts[index] };
              }
            }

            return { success: false };
          }

          export async function deleteDebt(personId, debtId) {
            const db = getDB();
            const id2 = realId(personId);

            const person = (db.persons || []).find(p => String(p.id) === String(id2));

            if (person && person.debts) {
              person.debts = person.debts.filter(d => String(d.id) !== String(debtId));
              saveDB(db);
            }

            return { success: true };
          }

          export async function getDebts(personId) {
            const person = await getPerson(personId);
            return smart(person.debts || []);
          }

          export async function getPasswords() {
            return smart([]);
          }

          export async function createPassword() {
            return { success: true };
          }

          export async function deletePassword() {
            return { success: true };
          }

          export async function exportData() {
            return getDB();
          }

          export async function importData(input) {
            const data = parseInput(input);
            if (typeof window !== "undefined") {
              localStorage.setItem("grocery_offline_db", JSON.stringify(data));
              window.location.reload();
            }
            return { success: true };
          }
          `;

              for (const name of exportNames) {
                if (code.includes(`function ${name}(`)) continue;
                code += `
          export async function ${name}(...args) {
            console.log("Offline mock:", "${name}", args);
            return { success: true, data: null };
          }
          `;
              }

              fs.writeFileSync(file, code);
            });
          }

          function patchPages(appDir) {
            if (!fs.existsSync(appDir)) return;

            walk(appDir, (file) => {
              if (!file.match(/page\.(tsx|ts|js|jsx)$/)) return;

              const parts = file.split(path.sep);
              const isDynamic = parts.some(p => p.includes("[") && p.includes("]"));

              if (!isDynamic) {
                let content = fs.readFileSync(file, "utf8");
                if (!content.includes('"use client"') && !content.includes("'use client'")) {
                  content = `"use client";\n` + content;
                  fs.writeFileSync(file, content);
                }
                return;
              }

              console.log("تجهيز صفحة ديناميكية:", file);

              let content = fs.readFileSync(file, "utf8");

              if (!content.includes('"use client"') && !content.includes("'use client'")) {
                content = `"use client";\n` + content;
              }

              const dir = path.dirname(file);
              const ext = path.extname(file);
              const clientFile = path.join(dir, "ClientPage" + ext);

              fs.writeFileSync(clientFile, content);

              const dynamicFolder = parts.find(p => p.includes("[") && p.includes("]"));
              const paramName = dynamicFolder.replace("[", "").replace("]", "") || "id";

              const wrapper = `// @ts-nocheck
          import ClientPage from "./ClientPage";

          export function generateStaticParams() {
            return [{ ${paramName}: "1" }];
          }

          export const dynamicParams = false;
          export const dynamic = "force-static";

          export default async function Page({ params }) {
            const resolvedParams = await params;
            return <ClientPage params={resolvedParams} searchParams={{}} />;
          }
          `;

              fs.writeFileSync(file, wrapper);
            });
          }

          mockServerActions("src");
          mockServerActions("app");

          patchPages("src/app");
          patchPages("app");
          EOF

          node mobile-patch.cjs

      - name: 9. بناء ملفات Next.js
        run: npm run build

      - name: 10. إصلاح روابط التفاصيل والتعديل بعد البناء
        run: |
          cat > inject-nav.cjs <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const script = `
          <script>
          (function () {
            if (window.__groceryRouteFix) return;
            window.__groceryRouteFix = true;

            function fixUrl(raw) {
              if (!raw) return null;

              try {
                var url = new URL(raw, window.location.href);
                var path = url.pathname;

                var person = path.match(/^\\/person\\/([^\\/]+)\\/?$/);
                if (person && person[1] !== "1") {
                  localStorage.setItem("current_person_id", decodeURIComponent(person[1]));
                  url.pathname = "/person/1/";
                  return url.href;
                }

                var edit = path.match(/^\\/edit\\/([^\\/]+)\\/?$/);
                if (edit && edit[1] !== "1") {
                  localStorage.setItem("current_person_id", decodeURIComponent(edit[1]));
                  url.pathname = "/edit/1/";
                  return url.href;
                }

                return null;
              } catch (e) {
                return null;
              }
            }

            document.addEventListener("click", function (e) {
              var el = e.target;

              while (el && el.tagName !== "A") {
                el = el.parentNode;
              }

              if (!el) return;

              var href = el.getAttribute("href");
              var fixed = fixUrl(href);

              if (fixed) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                window.location.href = fixed;
              }
            }, true);

            var oldPush = history.pushState;
            history.pushState = function (state, title, url) {
              var fixed = fixUrl(url);
              return oldPush.call(this, state, title, fixed || url);
            };

            var oldReplace = history.replaceState;
            history.replaceState = function (state, title, url) {
              var fixed = fixUrl(url);
              return oldReplace.call(this, state, title, fixed || url);
            };
          })();
          </script>
          `;

          function walk(dir) {
            if (!fs.existsSync(dir)) return;

            for (const item of fs.readdirSync(dir)) {
              const full = path.join(dir, item);
              const stat = fs.statSync(full);

              if (stat.isDirectory()) {
                walk(full);
              } else if (full.endsWith(".html")) {
                let html = fs.readFileSync(full, "utf8");

                if (!html.includes("__groceryRouteFix")) {
                  if (html.includes("</head>")) {
                    html = html.replace("</head>", script + "</head>");
                  } else {
                    html = script + html;
                  }

                  fs.writeFileSync(full, html);
                  console.log("Injected route fixer:", full);
                }
              }
            }
          }

          walk("out");
          EOF

          node inject-nav.cjs

      - name: 11. تثبيت Capacitor وتجهيز Android
        run: |
          rm -f capacitor.config.json capacitor.config.ts

          npm install @capacitor/core @capacitor/android @capacitor/cli --save-dev --legacy-peer-deps

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.grocery.debt",
            "appName": "Grocery Debt",
            "webDir": "out"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: 12. حل مشكلة Kotlin
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: 13. إعطاء صلاحية Gradle
        run: chmod +x android/gradlew

      - name: 14. بناء APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 15. رفع APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

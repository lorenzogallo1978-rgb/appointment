name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. تثبيت Java (نسخة 21)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. تثبيت مكتبات المشروع
        run: npm install --legacy-peer-deps

      - name: 5. تهيئة Next.js للعمل على الهاتف
        run: |
          echo "/** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true }
          };
          export default nextConfig;" > next.config.mjs

      - name: 6. كتابة الدفتر السري (.env)
        run: |
          echo "DATABASE_URL=postgresql://dummy_user:dummy_password@localhost:5432/dummy_db" > .env

      - name: 7. استبعاد ملفات الـ API الخاصة بالسيرفر مؤقتاً
        run: |
          rm -rf src/app/api
          rm -rf app/api

      - name: 8. زرع قاعدة بيانات الجوال الذكية (Proxy Offline LocalStorage DB) 🪄🎭🤝
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          // أولاً: تمويه الـ Server Actions لدوال وهمية ذكية تدعم الـ FormData والـ Proxy
          function mockServerActions(dir) {
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir);
            files.forEach(file => {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                mockServerActions(fullPath);
              } else if (file.match(/\.(tsx|ts|js|jsx)$/)) {
                let content = fs.readFileSync(fullPath, 'utf8');
                if (content.includes('\"use server\"') || content.includes('\'use server\'')) {
                  console.log('جاري زرع نظام قاعدة البيانات أوفلاين في الهاتف:', fullPath);
                  
                  const typeDefinitions = content.split('\n')
                    .filter(line => line.includes('export type') || line.includes('export interface') || line.includes('export class'))
                    .join('\n');

                  let mockContent = '// @ts-nocheck\n// تم تحويل الملف للعمل على الهاتف وحفظ البيانات أوفلاين\n\n';
                  mockContent += typeDefinitions + '\n\n';
                  
                  mockContent += \`
                  // دالة لترجمة مظاريف الـ FormData بأمان
                  function parseInput(data) {
                    if (!data) return {};
                    if (typeof data.get === 'function') {
                      const obj = {};
                      data.forEach((value, key) => {
                        obj[key] = value;
                      });
                      return obj;
                    }
                    return data;
                  }

                  function getLocalDB() {
                    if (typeof window === 'undefined') return { persons: [] };
                    try {
                      const data = localStorage.getItem('grocery_offline_db');
                      return data ? JSON.parse(data) : { persons: [] };
                    } catch (e) {
                      return { persons: [] };
                    }
                  }

                  function saveLocalDB(db) {
                    if (typeof window === 'undefined') return;
                    try {
                      localStorage.setItem('grocery_offline_db', JSON.stringify(db));
                      setTimeout(() => {
                        window.location.reload();
                      }, 150);
                    } catch (e) {}
                  }

                  // استخدام الـ JS Proxy السحري لمحاكاة المصفوفات الحقيقية 100%
                  function createSmartResponse(dataArray) {
                    const arr = Array.isArray(dataArray) ? dataArray : [];
                    return new Proxy(arr, {
                      get(target, prop) {
                        if (prop === 'success') return true;
                        if (prop === 'data') return target;
                        return target[prop];
                      }
                    });
                  }

                  export async function getPersons() {
                    const db = getLocalDB();
                    return createSmartResponse(db.persons || []);
                  }

                  export async function getPerson(id) {
                    const db = getLocalDB();
                    const person = (db.persons || []).find(p => String(p.id) === String(id));
                    return createSmartResponse(person || { id: String(id), name: 'مستخدم تجريبي', phone: '', debts: [], createdAt: new Date() });
                  }

                  export async function createPerson(rawInput) {
                    const data = parseInput(rawInput);
                    const db = getLocalDB();
                    if (!db.persons) db.persons = [];
                    const newPerson = {
                      id: Date.now().toString(),
                      name: data.name || 'مستخدم جديد',
                      phone: data.phone || '',
                      debts: [],
                      createdAt: new Date().toISOString(),
                      ...data
                    };
                    db.persons.push(newPerson);
                    saveLocalDB(db);
                    return { success: true, data: newPerson };
                  }

                  export async function updatePerson(id, rawInput) {
                    const data = parseInput(rawInput);
                    const db = getLocalDB();
                    if (!db.persons) db.persons = [];
                    const idx = db.persons.findIndex(p => String(p.id) === String(id));
                    if (idx !== -1) {
                      db.persons[idx] = { ...db.persons[idx], ...data };
                      saveLocalDB(db);
                    }
                    return { success: true, data: db.persons[idx] };
                  }

                  export async function deletePerson(id) {
                    const db = getLocalDB();
                    if (!db.persons) db.persons = [];
                    db.persons = db.persons.filter(p => String(p.id) !== String(id));
                    saveLocalDB(db);
                    return { success: true };
                  }

                  export async function createDebt(personId, rawInput) {
                    const data = parseInput(rawInput);
                    const db = getLocalDB();
                    const idx = db.persons.findIndex(p => String(p.id) === String(personId));
                    if (idx !== -1) {
                      if (!db.persons[idx].debts) db.persons[idx].debts = [];
                      const newDebt = {
                        id: Date.now().toString(),
                        amount: Number(data.amount) || 0,
                        description: data.description || '',
                        date: data.date || new Date().toISOString(),
                        createdAt: new Date().toISOString(),
                        ...data
                      };
                      db.persons[idx].debts.push(newDebt);
                      saveLocalDB(db);
                      return { success: true, data: newDebt };
                    }
                    return { success: false };
                  }

                  export async function deleteDebt(personId, debtId) {
                    const db = getLocalDB();
                    const idx = db.persons.findIndex(p => String(p.id) === String(personId));
                    if (idx !== -1 && db.persons[idx].debts) {
                      db.persons[idx].debts = db.persons[idx].debts.filter(d => String(d.id) !== String(debtId));
                      saveLocalDB(db);
                    }
                    return { success: true };
                  }

                  export async function getPasswords() { return createSmartResponse([]); }
                  export async function createPassword() { return { success: true }; }
                  \`;
                  
                  fs.writeFileSync(fullPath, mockContent);
                }
              }
            });
          }

          // ثانياً: تهيئة شاشات الهاتف بالكامل لتفعيل التحديث التلقائي الفوري محلياً
          function patchAllPages(dir) {
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir);
            files.forEach(file => {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                // إذا وجدنا مجلد ديناميكي [id] نقوم بعمل تغليف آمن
                if (file.includes('[') && file.includes(']')) {
                  console.log('جاري تفعيل شاشة ديناميكية تفاعلية للهاتف:', fullPath);
                  const pageFile = fs.readdirSync(fullPath).find(f => f.match(/^page\.(tsx|ts|js|jsx)$/));
                  if (pageFile) {
                    const pagePath = path.join(fullPath, pageFile);
                    let content = fs.readFileSync(pagePath, 'utf8');
                    const paramName = file.replace('[', '').replace(']', '');

                    if (!content.includes('\"use client\"') && !content.includes('\'use client\'')) {
                      content = '\"use client\";\n' + content;
                    }
                    
                    const clientPagePath = path.join(fullPath, 'ClientPage' + path.extname(pageFile));
                    fs.writeFileSync(clientPagePath, content);

                    const wrapperCode = '// @ts-nocheck\nimport ClientPage from \"./ClientPage\";\n\nexport function generateStaticParams() {\n  return [{ \'' + paramName + '\': \"1\" }];\n}\nexport const dynamicParams = false;\nexport const dynamic = \"force-static\";\n\nexport default async function Page({ params }: any) {\n  const resolvedParams = await params;\n  return <ClientPage params={resolvedParams} searchParams={Promise.resolve({})} />;\n}\n';
                    fs.writeFileSync(pagePath, wrapperCode);
                  }
                } else {
                  patchAllPages(fullPath);
                }
              } else if (file.match(/^page\.(tsx|ts|js|jsx)$/)) {
                // تفعيل التحديث التلقائي للصفحة الرئيسية وكل الصفحات العادية
                console.log('جاري تحويل الصفحة لهوية تفاعلية (Client Component):', fullPath);
                let content = fs.readFileSync(fullPath, 'utf8');
                if (!content.includes('\"use client\"') && !content.includes('\'use client\'')) {
                  content = '\"use client\";\n' + content;
                  fs.writeFileSync(fullPath, content);
                }
              }
            });
          }

          mockServerActions('src');
          mockServerActions('app');
          patchAllPages('src/app');
          patchAllPages('app');
          "

      - name: 9. بناء ملفات الويب الثابتة (out)
        run: npm run build

      - name: 10. تهيئة وتثبيت Capacitor والأندرويد بأمان 📱⚙️
        run: |
          rm -f capacitor.config.json capacitor.config.ts
          npm install @capacitor/core @capacitor/android @capacitor/cli --save-dev --legacy-peer-deps
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.grocery.debt",
            "appName": "Grocery Debt",
            "webDir": "out"
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: 11. حل مشكلة Kotlin المكررة
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: 12. صلاحيات البناء
        run: chmod +x android/gradlew

      - name: 13. بناء الـ APK النهائي
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 14. رفع ملف الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: 2. تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. تثبيت Java (نسخة 21)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. تثبيت مكتبات المشروع
        run: npm install --legacy-peer-deps

      - name: 5. تهيئة Next.js للعمل على الهاتف (إصدار نظيف بدون تحذيرات) 🛠️
        run: |
          echo "/** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true }
          };
          export default nextConfig;" > next.config.mjs

      - name: 6. كتابة الدفتر السري (.env)
        run: |
          echo "DATABASE_URL=postgresql://dummy_user:dummy_password@localhost:5432/dummy_db" > .env

      - name: 7. استبعاد ملفات الـ API الخاصة بالسيرفر مؤقتاً
        run: |
          rm -rf src/app/api
          rm -rf app/api

      - name: 8. فصل الصفحات مع حقن الـ searchParams الوهمي لتوافق الهاتف 🪄🎭
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          function patchDynamicPages(dir) {
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir);
            files.forEach(file => {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                patchDynamicPages(fullPath);
              } else if (file.match(/^page\.(tsx|ts|js|jsx)$/)) {
                if (fullPath.includes('[') && fullPath.includes(']')) {
                  console.log('جاري تهيئة وتأمين الصفحة الديناميكية:', fullPath);
                  const content = fs.readFileSync(fullPath, 'utf8');
                  const dirName = path.basename(path.dirname(fullPath));
                  const paramMatch = dirName.match(/\[([^\]]+)\]/);
                  const paramName = paramMatch ? paramMatch[1] : 'id';

                  if (content.includes('\"use client\"') || content.includes('\'use client\'')) {
                    const dirPath = path.dirname(fullPath);
                    const ext = path.extname(file);
                    const clientPagePath = path.join(dirPath, 'ClientPage' + ext);
                    
                    // 1. نقل الملف الأصلي
                    fs.renameSync(fullPath, clientPagePath);

                    // 2. إنشاء الموزع الجديد وحقن الـ searchParams كوعد محلول (Promise.resolve) لمنع خطأ البناء!
                    const wrapperCode = '// @ts-nocheck\nimport ClientPage from \"./ClientPage\";\n\nexport function generateStaticParams() {\n  return [{ ' + paramName + ': \"1\" }];\n}\nexport const dynamicParams = false;\nexport const dynamic = \"force-static\";\n\nexport default async function Page(props: any) {\n  const params = await props.params;\n  return <ClientPage params={params} searchParams={Promise.resolve({})} />;\n}\n';
                    fs.writeFileSync(fullPath, wrapperCode);
                    console.log('تم تأمين شاشة الهاتف بنجاح!');
                  } else {
                    if (!content.includes('generateStaticParams')) {
                      const appendCode = '\n// @ts-nocheck\nexport function generateStaticParams() {\n  return [{ ' + paramName + ': \"1\" }];\n}\nexport const dynamicParams = false;\nexport const dynamic = \"force-static\";\n';
                      fs.appendFileSync(fullPath, appendCode);
                    }
                  }
                }
              }
            });
          }

          patchDynamicPages('src/app');
          patchDynamicPages('app');
          "

      - name: 9. بناء ملفات الويب الثابتة (out)
        run: npm run build

      - name: 10. تهيئة وتثبيت Capacitor تلقائياً للهاتف
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android --legacy-peer-deps
          
          rm -f capacitor.config.json capacitor.config.ts
          echo '{
            "appId": "com.grocery.debt",
            "appName": "Grocery Debt",
            "webDir": "out"
          }' > capacitor.config.json
          
          npx cap add android
          npx cap sync android

      - name: 11. حل مشكلة Kotlin المكررة
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: 12. صلاحيات البناء
        run: chmod +x android/gradlew

      - name: 13. بناء الـ APK النهائي
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 14. رفع ملف الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
